<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Personalakten Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eaeef3; --line:#d9dfe7; --line-2:#c4ccd7;
  --fg:#18212c; --muted:#5b6777; --ink:#1f3a5f; --ink-soft:#e3eaf3; --ink-fg:#ffffff;
  --chg:#fff3a6; --next:#cfdcf0;
  --ok:#2c7a4b; --ok-soft:#dff1e6; --warn:#a15c00; --warn-soft:#fdebcf; --bad:#b03a32; --bad-soft:#f8e0dd;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-display:"Fraunces",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#161e28; --surface-2:#1d2733; --line:#283442; --line-2:#364556;
  --fg:#e4e9ef; --muted:#93a0b0; --ink:#8fb3e6; --ink-soft:#1f2f45; --ink-fg:#0f151c;
  --chg:#5a4f12; --next:#25395a;
  --ok:#62c48b; --ok-soft:#173022; --warn:#f0b04a; --warn-soft:#3a2b12; --bad:#ef7d74; --bad-soft:#3d1d1a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ink{background:var(--ink-soft);color:var(--ink)}
.msg{border-radius:6px;padding:9px 12px;font-size:13px}
.msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.warn{background:var(--warn-soft);color:var(--warn)}

/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:16px}
.brandmark{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:36px;border:2px solid var(--ink);border-radius:3px 10px 3px 3px;position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;left:5px;right:5px;height:2px;background:var(--ink);border-radius:1px}
.mark::before{top:10px}.mark::after{top:17px;right:10px}
.qr{background:#fff;border-radius:8px;padding:10px;justify-self:center}
.qr img{display:block;width:180px;height:180px}
.linkbtn{border:0;background:none;color:var(--ink);cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline;justify-self:start}

/* shell */
#app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
nav.side .brandmark{padding:0 8px 16px}
nav.side .brandmark b{font-family:var(--f-display);font-size:17px;font-weight:600}
.navbtn{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--ink-soft);color:var(--ink);font-weight:600}
.badge{background:var(--ink);color:var(--ink-fg);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.user{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:grid;gap:4px;font-size:12.5px}
main{padding:20px 24px 48px;display:grid;gap:18px;align-content:start;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
@media (max-width:780px){
  #app{grid-template-columns:1fr}
  nav.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  nav.side .brandmark{width:100%;padding:0 0 6px}
  .user{width:100%;margin-top:6px;grid-auto-flow:column;justify-content:space-between;align-items:center}
  main{padding-inline:16px}
}

/* upload */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto 1fr;min-width:0}
.zone header{padding:12px 14px;border-bottom:1px solid var(--line)}
.zone header b{font-weight:600}
.drop{margin:10px;border:1.5px dashed var(--line-2);border-radius:6px;min-height:110px;padding:10px;display:grid;align-content:start;gap:6px;cursor:pointer}
.drop.over{border-color:var(--ink);background:var(--ink-soft)}
.drop .e{color:var(--muted);font-size:12.5px;text-align:center;align-self:center;padding:16px 4px}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--surface-2);border-radius:5px;padding:6px 8px;font-size:12px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.bar .grow{flex:1;min-width:200px}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.6fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.row:last-child{border-bottom:0}
.row .fn{overflow-wrap:anywhere}
@media (max-width:700px){.row{grid-template-columns:1fr}}

/* review */
.review{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.review{grid-template-columns:1fr}}
.qitem{display:grid;gap:3px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer}
.qitem:last-child{border-bottom:0}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-current="true"]{background:var(--ink-soft);box-shadow:inset 3px 0 0 var(--ink)}
.qitem .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:1200px){.split{grid-template-columns:1fr}}
.preview{height:72vh;min-height:420px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);overflow:hidden}
.preview iframe,.preview img{width:100%;height:100%;border:0;object-fit:contain;display:block}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.checks{display:grid;gap:6px}
.fields{display:grid;gap:0}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
.fld:first-child{border-top:0}
.fld .k{font-size:12.5px;font-weight:600;padding-top:7px}
.fld .v{display:grid;gap:4px}
.fld .v .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld.warn input,.fld.warn select{border-color:var(--warn);background:var(--warn-soft)}
.fld.changed .k::after{content:" ●";color:var(--warn)}
.quote{font-size:12px;color:var(--muted);font-style:italic;border-left:2px solid var(--line-2);padding-left:8px}
.old{font-size:12px;color:var(--muted)}
@media (max-width:600px){.fld{grid-template-columns:1fr}.fld .k{padding-top:0}}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details.raw pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:var(--surface-2);padding:8px;border-radius:6px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.scroll{overflow-x:auto}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters > *{width:auto;min-width:180px}

/* personalakten */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg);font-weight:600}
.akten{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.akten{grid-template-columns:1fr}}
.folders{max-height:70vh;overflow:auto}
.folder{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer}
.folder:last-child{border-bottom:0}
.folder:hover{background:var(--surface-2)}
.folder[aria-current="true"]{background:var(--ink-soft);box-shadow:inset 3px 0 0 var(--ink)}
.folder .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder.inactive .nm{color:var(--muted)}
.fic{width:18px;height:14px;border:1.5px solid var(--muted);border-radius:2px 2px 3px 3px;position:relative;margin-top:2px}
.fic::before{content:"";position:absolute;left:-1.5px;top:-5px;width:8px;height:4px;border:1.5px solid var(--muted);border-bottom:0;border-radius:2px 2px 0 0}
.folder[aria-current="true"] .fic,.folder[aria-current="true"] .fic::before{border-color:var(--ink)}
.folder.inbox .fic{border-style:dashed}
.ftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ftools input[type=search]{flex:1;min-width:140px}
.ftools input[type=checkbox]{width:auto;flex:none;margin:0}
.dname{overflow-wrap:anywhere;font-weight:500}
.dorig{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
@media (max-width:600px){.acts{flex-wrap:wrap}}

/* monatsabschluss */
.lg{display:inline-block;padding:0 6px;border-radius:3px;color:#18212c;font-size:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.tbl.ll td{padding:4px 6px;white-space:nowrap}
.tbl.ll td:last-child{white-space:normal;min-width:260px}
.tbl.ll th{white-space:nowrap}
.mi{width:80px;padding:4px 6px;font-size:12.5px;background:transparent}
.mi.wide{width:220px}
.tbl.ll td[style] .mi{border-color:rgba(0,0,0,.25);color:#18212c}
.editgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}

/* drawer */
.drawer{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(0,620px);z-index:20}
.drawer .shade{background:rgba(10,15,22,.4)}
.drawer .body{background:var(--surface);overflow:auto;padding:20px 22px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;padding-top:calc(20px + env(safe-area-inset-top,0px))}
@media (max-width:700px){.drawer{grid-template-columns:0 1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px}
.kv div{display:grid;gap:2px}
.kv span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:90vw}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<section id="auth">
  <div class="card" id="auth-card"></div>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <nav class="side" aria-label="Hauptnavigation">
    <div class="brandmark"><span class="mark" aria-hidden="true"></span><b>Personalakten Hub</b></div>
    <button class="navbtn" data-view="upload">Dokumente einreichen</button>
    <button class="navbtn" data-view="review">Prüfen <span class="badge" id="b-review" hidden></span></button>
    <button class="navbtn" data-view="akten">Personalakten</button>
    <button class="navbtn" data-view="employees">Mitarbeiter</button>
    <button class="navbtn" data-view="monat">Monatsabschluss</button>
    <button class="navbtn" data-view="personalkosten">Personalkosten</button>
    <button class="navbtn" data-view="deadlines">Fristen <span class="badge" id="b-deadlines" hidden></span></button>
    <div class="user">
      <b id="u-name"></b>
      <span class="hint" id="u-role"></span>
      <button class="linkbtn" id="logout">Abmelden</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<div id="drawer" class="drawer" hidden><div class="shade" data-close></div><div class="body" id="drawer-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<script src="regeln.js"></script>
<script src="lohnauswertung.js"></script>
<script>
"use strict";
/* ---------- Konfiguration (öffentliche Werte; Schutz über Login, 2FA und Zugriffsregeln in Supabase) ---------- */
const SUPABASE_URL = "https://yeeqapgezbjezqwzzsfb.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZBpV6Y9jOrarb7NTxUbwyw_t2zGCr2F";

const LINK_TYPE = (new URLSearchParams(location.hash.slice(1))).get("type"); // invite / recovery
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (d) => d ? new Date(d + (d.length === 10 ? "T00:00:00" : "")).toLocaleDateString("de-DE") : "–";
const fmtNum = (n, dec = 2) => n === null || n === undefined || n === "" ? "–" : Number(n).toLocaleString("de-DE", { minimumFractionDigits: dec, maximumFractionDigits: dec });
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }

const S = { me: null, profile: null, companies: [], view: "upload", files: {}, runs: [], current: null };

/* =====================================================================
   AUTH: Passwort → 2FA (Einrichtung oder Code) → App
   ===================================================================== */
function authCard(html) { $("#auth").hidden = false; $("#app").hidden = true; $("#auth-card").innerHTML =
  `<div class="brandmark"><span class="mark" aria-hidden="true"></span><h1>Personalakten Hub</h1></div>` + html; }

function showLogin(note = "") {
  authCard(`
    <p class="hint" style="margin:0">Anmeldung nur für eingeladene Nutzer.</p>
    ${note}
    <label class="f">E-Mail<input id="a-mail" type="email" autocomplete="username"></label>
    <label class="f">Passwort<input id="a-pw" type="password" autocomplete="current-password"></label>
    <div id="a-err"></div>
    <button class="btn primary" id="a-go">Anmelden</button>
    <button class="linkbtn" id="a-forgot">Passwort vergessen</button>`);
  const go = async () => {
    $("#a-go").disabled = true; $("#a-err").innerHTML = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("#a-mail").value.trim(), password: $("#a-pw").value });
    $("#a-go").disabled = false;
    if (error) return $("#a-err").innerHTML = `<div class="msg bad">Anmeldung fehlgeschlagen: E-Mail oder Passwort stimmt nicht.</div>`;
    afterPassword();
  };
  $("#a-go").onclick = go;
  $$("#a-mail,#a-pw").forEach((i) => i.addEventListener("keydown", (e) => e.key === "Enter" && go()));
  $("#a-forgot").onclick = async () => {
    const mail = $("#a-mail").value.trim();
    if (!mail) return $("#a-err").innerHTML = `<div class="msg warn">Bitte zuerst die E-Mail eintragen.</div>`;
    await sb.auth.resetPasswordForEmail(mail, { redirectTo: location.origin + location.pathname });
    $("#a-err").innerHTML = `<div class="msg ok">Wenn die Adresse eingeladen ist, kommt gleich eine E-Mail mit einem Link.</div>`;
  };
  $("#a-mail").focus();
}

function showSetPassword() {
  authCard(`
    <p style="margin:0">${LINK_TYPE === "invite" ? "Willkommen! Lege ein Passwort fest." : "Lege ein neues Passwort fest."}</p>
    <label class="f">Neues Passwort (mind. 12 Zeichen)<input id="p1" type="password" autocomplete="new-password"></label>
    <label class="f">Wiederholen<input id="p2" type="password" autocomplete="new-password"></label>
    <div id="p-err"></div>
    <button class="btn primary" id="p-go">Passwort speichern</button>`);
  $("#p-go").onclick = async () => {
    const a = $("#p1").value, b = $("#p2").value;
    if (a.length < 12) return $("#p-err").innerHTML = `<div class="msg warn">Mindestens 12 Zeichen.</div>`;
    if (a !== b) return $("#p-err").innerHTML = `<div class="msg warn">Die Passwörter stimmen nicht überein.</div>`;
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return $("#p-err").innerHTML = `<div class="msg bad">${esc(error.message)}</div>`;
    history.replaceState(null, "", location.pathname);
    afterPassword();
  };
}

async function afterPassword() {
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel === "aal2") return startApp();
  const { data: f } = await sb.auth.mfa.listFactors();
  const verified = (f?.totp || []).find((x) => x.status === "verified");
  if (verified) return showCode(verified.id);
  return showEnroll(f);
}

async function showEnroll(f) {
  for (const x of (f?.all || []).filter((x) => x.status === "unverified")) await sb.auth.mfa.unenroll({ factorId: x.id });
  const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "HR-Tool " + new Date().toISOString().slice(0, 16) });
  if (error) return authCard(`<div class="msg bad">2FA-Einrichtung fehlgeschlagen: ${esc(error.message)}</div>`);
  authCard(`
    <p style="margin:0"><b>Zwei-Faktor-Anmeldung einrichten.</b> Scanne den Code mit einer Authenticator-App (z. B. Microsoft oder Google Authenticator) und gib den 6-stelligen Code ein.</p>
    <div class="qr"><img alt="QR-Code für die Authenticator-App" src="${esc(data.totp.qr_code)}"></div>

  if (vals.probation_until) r.push({ kind: "Probezeit endet", due_date: vals.probation_until });
  if (vals.work_permit_until) r.push({ kind: "Arbeitserlaubnis läuft ab", due_date: vals.work_permit_until });
  if (vals.enrollment_until) r.push({ kind: "Neue Immatrikulation nötig", due_date: vals.enrollment_until });
  return r;
}

  let { fields, effective } = buildFields(type, r, !d.ex.suggested_employee_id);

  const sug = d.ex.suggested_employee_id || "";

    !fields.some((f) => f.src === v));

  det.innerHTML = `<div class="split">

      <div class="sec">
        <div class="head"><div><h2>${esc(TYPE_LABEL[type] || type)}</h2><span class="hint">${esc(d.original_filename)} · ${esc(d.companies.name)}</span></div>
          <span class="pill ${r.dokumentstatus === "unterschrieben_beide" ? "ok" : "warn"}">${esc((r.dokumentstatus || "–").replace(/_/g, " "))}</span></div>
        ${(d.ex.checks || []).length ? `<div class="checks">${d.ex.checks.map((c) => `<div class="msg warn">${esc(c.text)}</div>`).join("")}</div>` : ""}
        ${(r.hinweise || []).map((h) => `<div class="msg warn">${esc(h.text)}${h.seite ? ` (S. ${h.seite})` : ""}</div>`).join("")}

      <div class="sec">

          ${f.src?.zitat ? `<span class="quote">„${esc(f.src.zitat)}“${f.src.seite ? ` – S. ${f.src.seite}` : ""}</span>` : ""}
        </div></div>`;
    }).join("");
  };
  const rebuild = () => { ({ fields, effective } = buildFields($("#r-type").value, r, !$("#r-emp").value)); if (!$("#r-eff").value && effective) $("#r-eff").value = effective; renderFields(); };
  renderFields();
  $("#r-emp").onchange = rebuild;
  $("#r-type").onchange = rebuild;
  if (!canEdit()) return;
  $("#r-reject").onclick = () => rejectDoc(d);
  $("#r-ai").onclick = async () => {
    if (!confirm("Mit Claude auslesen? Das verursacht Kosten (wenige Cent) und funktioniert nur mit hinterlegtem API-Schlüssel.")) return;
    $("#r-ai").disabled = true; $("#r-ai").textContent = "Claude liest …";
    const { error } = await sb.functions.invoke("extrahieren", { body: { document_id: d.id } });

    const empId = $("#r-emp").value || null; const emp = S.emps.find((e) => e.id === empId);
    const vals = {}, bad = [];
    $$("#r-fields [data-n]").forEach((inp) => {
      const f = fields[+inp.dataset.n]; let v = inp.value.trim();
      if (v === "") v = f.clear ? null : undefined;
      else if (NUM_FIELDS.includes(f.key)) { const n = v.includes(",") ? Number(v.replace(/\./g, "").replace(",", ".")) : Number(v); if (Number.isNaN(n)) { bad.push(FIELD_LABEL[f.key]); return; } v = n; }
      if (v === undefined) return;
      if (emp && String(emp[f.key] ?? "") === String(v ?? "")) return; // unverändert
      if (emp && NUM_FIELDS.includes(f.key) && emp[f.key] !== null && Number(emp[f.key]) === Number(v)) return;
      vals[f.key] = v;
    });
    if (bad.length) { $("#r-err").innerHTML = `<div class="msg bad">Keine gültige Zahl: ${esc(bad.join(", "))}</div>`; return; }
    const sp = sensitiveProbleme(vals);
    if (sp.length && !confirm(sp.join("\n") + "\n\nTrotzdem so übernehmen?")) { $("#r-err").innerHTML = `<div class="msg bad">${esc(sp.join(" · "))}</div>`; return; }
    if (!empId && (!vals.last_name || !vals.first_name)) {
      $("#r-err").innerHTML = `<div class="msg bad">Für einen neuen Mitarbeiter fehlen Nachname oder Vorname. Bitte Mitarbeiter wählen oder Namen ergänzen.</div>`; return;
    }
    $("#r-ok").disabled = true;
    const { error } = await sb.rpc("confirm_extraction", {
      p_extraction: d.ex.id, p_employee: empId, p_fields: vals, p_effective: $("#r-eff").value || null,
      p_doc_type: $("#r-type").value, p_doc_date: r.dokumentdatum?.wert || null, p_reminders: remindersFor(vals),
    });
    $("#r-ok").disabled = false;
    if (error) return $("#r-err").innerHTML = `<div class="msg bad">${esc(error.message)}</div>`;
    toast("Bestätigt und eingetragen"); refreshBadges(); viewReview();
  };
}
async function rejectDoc(d) {
  if (!confirm("Dokument ablehnen? Die Datei bleibt gespeichert, es wird nichts eingetragen.")) return;
  if (d.ex) await sb.from("extractions").update({ decision: "abgelehnt", reviewed_by: S.me.id, reviewed_at: new Date().toISOString() }).eq("id", d.ex.id);
  await sb.from("documents").update({ status: "abgelehnt" }).eq("id", d.id);
  toast("Abgelehnt"); refreshBadges(); viewReview();
}

      const { error } = await sb.rpc("update_employee", { p_employee: id, p_fields: vals, p_effective: $("#emp-eff").value || null });
      if (error) return $("#emp-err").innerHTML = `<div class="msg bad">${esc(error.message)}</div>`;
      toast("Gespeichert");
      S.allEmps = (await sb.from("employees").select("*, companies(name)").order("last_name")).data || [];
      openEmployee(id);
    };
  }
  $$("[data-open]", $("#drawer-body")).forEach((b) => b.onclick = async () => {
    const w = window.open("", "_blank");
    const { data } = await sb.storage.from("dokumente").createSignedUrl(b.dataset.open, 300);
    if (data) w.location = data.signedUrl; else w.close();
  });
}

/* ---------------- Personalakten (Ordneransicht) ---------------- */
const CODE_OUT = { AV: "AV", AEV: "ÄV", KUE: "KÜ", AHV: "AHV", PB: "PB", ARBEITSERLAUBNIS: "Arbeitserlaubnis", IMMA: "Imma", GV: "GV", PASS: "Pass", ERKLAERUNG_BESCHAEFTIGUNG: "Erklärung Beschäftigung", LOHNAUSWERTUNG: "Lohnauswertung", SONSTIGES: "Dokument" };
const STATUS_LABEL = { hochgeladen: ["", "hochgeladen"], in_verarbeitung: ["ink", "wird gelesen"], vorschlag: ["warn", "zu prüfen"], bestaetigt: ["ok", "bestätigt"], abgelehnt: ["bad", "abgelehnt"], fehler: ["bad", "Fehler"] };
/* Standardname wie im Namensschema: JJJJ-MM-TT_TYP_[Detail]_Nachname, Vorname.ext */
function stdName(d, emp) {
  const ext = (d.original_filename.split(".").pop() || "pdf").toLowerCase();
  const dn = Regeln.ausDateiname(d.original_filename);
  const who = emp ? `${emp.last_name}, ${emp.first_name}` : dn.nachname ? `${dn.nachname}, ${dn.vorname}` : "";
  const detail = dn.typ ? dn.detail : "";
  const entwurf = dn.entwurf || ext === "docx" ? "Entwurf" : "";
  const parts = [d.doc_date || dn.datum || (d.uploaded_at || "").slice(0, 10), CODE_OUT[d.doc_type] || "Dokument", entwurf, detail, who].filter(Boolean);
  if (!dn.typ && !who) parts.push(d.original_filename.replace(/\.[^.]+$/, ""));
  return parts.join("_").replace(/[\\/:*?"<>|]+/g, "-") + "." + ext;
}

async function viewAkten() {
  const m = $("#main");
  S.akten ||= { company: S.companies[0]?.id, folder: "eingang", q: "", alle: false };
  m.innerHTML = `<div class="head"><div><h1>Personalakten</h1><p>Alle Dokumente, geordnet wie auf F:\\DATA: ein Ordner pro Mitarbeiter, Dateien im Namensschema. Neue Dateien liegen im „Eingang“, bis sie im Schritt „Prüfen“ bestätigt sind.</p></div>
      <button class="btn" id="k-zipall">Ganze Firma als ZIP</button></div>
    <div class="tabs" role="group" aria-label="Firma">${S.companies.map((c) => `<button class="tab" data-c="${c.id}" aria-pressed="${c.id === S.akten.company}">${esc(c.name)}</button>`).join("")}</div>
    <div class="akten">
      <div class="panel">
        <div class="ftools"><input id="k-q" type="search" placeholder="Ordner suchen" value="${esc(S.akten.q)}">
          <label class="hint" style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" id="k-alle" style="width:auto" ${S.akten.alle ? "checked" : ""}> inaktive</label></div>
        <div class="folders" id="k-folders"></div>
      </div>
      <div class="panel" id="k-docs"></div>
    </div>`;
  $$(".tab").forEach((t) => t.onclick = () => { S.akten.company = t.dataset.c; S.akten.folder = "eingang"; viewAkten(); });
  $("#k-q").oninput = (e) => { S.akten.q = e.target.value; renderFolders(); };
  $("#k-alle").onchange = (e) => { S.akten.alle = e.target.checked; renderFolders(); };
  const cid = S.akten.company;
  const [{ data: emps }, { data: docs }] = await Promise.all([
    sb.from("employees").select("id,last_name,first_name,status,folder_name").eq("company_id", cid).order("last_name"),
    sb.from("documents").select("id,employee_id,storage_path,original_filename,doc_type,doc_date,status,uploaded_at").eq("company_id", cid).order("doc_date", { ascending: true }),

function folderDocs(fid) {
  const A = S.akten;
  if (fid === "lohn") return A.docs.filter((d) => d.doc_type === "LOHNAUSWERTUNG");
  return fid === "eingang" ? A.docs.filter((d) => !d.employee_id && d.doc_type !== "LOHNAUSWERTUNG") : A.docs.filter((d) => d.employee_id === fid);
}
function renderFolders() {
  const A = S.akten, q = A.q.toLowerCase();
  const list = A.emps.filter((e) => (A.alle || e.status === "aktiv" || e.id === A.folder) && (!q || e.folder_name.toLowerCase().includes(q)));
  const inbox = folderDocs("eingang").length;
  $("#k-folders").innerHTML =
    `<button class="folder inbox" data-f="eingang" aria-current="${A.folder === "eingang"}"><span class="fic"></span><span class="nm">Eingang</span>${inbox ? `<span class="badge">${inbox}</span>` : `<span class="hint">0</span>`}</button>` +
    (canEdit() && folderDocs("lohn").length ? `<button class="folder inbox" data-f="lohn" aria-current="${A.folder === "lohn"}"><span class="fic"></span><span class="nm">Lohnauswertungen TLC</span><span class="hint">${folderDocs("lohn").length}</span></button>` : "") +
    list.map((e) => `<button class="folder ${e.status === "inaktiv" ? "inactive" : ""}" data-f="${e.id}" aria-current="${A.folder === e.id}"><span class="fic"></span>
      <span class="nm" title="${esc(e.folder_name)}">${esc(e.folder_name)}</span><span class="hint">${folderDocs(e.id).length}</span></button>`).join("") +
    (list.length ? "" : `<div class="empty">${q ? "Kein Ordner gefunden." : "Noch keine Mitarbeiter-Ordner. Sie entstehen beim Bestätigen eines Arbeitsvertrags."}</div>`);
  $$(".folder").forEach((b) => b.onclick = () => { S.akten.folder = b.dataset.f; renderFolders(); renderDocs(); });
}
function renderDocs() {
  const A = S.akten, emp = A.emps.find((e) => e.id === A.folder);
  const docs = folderDocs(A.folder);
  const title = emp ? emp.folder_name : A.folder === "lohn" ? "Lohnauswertungen TLC" : "Eingang";
  $("#k-docs").innerHTML = `<div class="ftools"><h2 style="flex:1">${esc(title)}</h2>
      ${emp ? `<button class="btn small" id="k-emp">Stammdaten</button>` : ""}
      ${docs.length ? `<button class="btn small" id="k-zip">Ordner als ZIP</button>` : ""}</div>
    ${docs.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Datei</th><th>Datum</th><th>Status</th><th></th></tr></thead><tbody>
      ${docs.map((d) => { const st = STATUS_LABEL[d.status] || ["", d.status]; return `<tr>
        <td><div class="dname">${esc(stdName(d, emp))}</div>${stdName(d, emp) !== d.original_filename ? `<div class="dorig">hochgeladen als: ${esc(d.original_filename)}</div>` : ""}</td>
        <td class="mono">${fmtDate(d.doc_date)}</td><td><span class="pill ${st[0]}">${esc(st[1])}</span></td>
        <td><div class="acts"><button class="btn small" data-o="${d.id}">Öffnen</button><button class="btn small" data-dl="${d.id}">Herunterladen</button></div></td></tr>`; }).join("")}
      </tbody></table></div>`
    : `<div class="empty">${emp ? "Dieser Ordner ist leer." : "Keine offenen Dateien im Eingang."}</div>`}`;
  $$("[data-o]").forEach((b) => b.onclick = () => openDoc(docs.find((d) => d.id === b.dataset.o), false, emp));
  $$("[data-dl]").forEach((b) => b.onclick = () => openDoc(docs.find((d) => d.id === b.dataset.dl), true, emp));
  if (emp) $("#k-emp").onclick = async () => { if (!S.allEmps) S.allEmps = (await sb.from("employees").select("*, companies(name)")).data || []; openEmployee(emp.id); };
  if (docs.length) $("#k-zip").onclick = () => zipDocs(`${title}.zip`, docs.map((d) => ({ d, path: stdName(d, emp) })));
}
async function openDoc(d, download, emp) {
  const w = download ? null : window.open("", "_blank");
  const { data, error } = await sb.storage.from("dokumente").createSignedUrl(d.storage_path, 300, download ? { download: stdName(d, emp) } : undefined);
  if (error || !data) { if (w) w.close(); return toast("Datei konnte nicht geöffnet werden"); }
  if (w) w.location = data.signedUrl;
  else { const a = document.createElement("a"); a.href = data.signedUrl; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Laden fehlgeschlagen: " + src)); document.head.appendChild(s); }); }
async function zipDocs(zipName, items) {
  if (!items.length) return toast("Keine Dateien");
  toast(`ZIP wird erstellt (${items.length} Dateien) …`);
  if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const zip = new JSZip(), used = new Set();
  let i = 0;
  for (const { d, path } of items) {
    let p = path, n = 2;
    while (used.has(p)) p = path.replace(/(\.[^.]+)$/, ` (${n++})$1`);
    used.add(p);
    const { data } = await sb.storage.from("dokumente").download(d.storage_path);
    if (data) zip.file(p, data);
    if (++i % 5 === 0) toast(`ZIP: ${i} von ${items.length} …`);
  }
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = zipName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast("ZIP heruntergeladen");
}
function zipCompany() {
  const A = S.akten, c = S.companies.find((x) => x.id === A.company);
  const items = A.docs.map((d) => {
    const emp = A.emps.find((e) => e.id === d.employee_id);
    return { d, path: `Personalakten/${emp ? emp.folder_name : d.doc_type === "LOHNAUSWERTUNG" ? "00_Lohnauswertungen" : "00_Eingang"}/${stdName(d, emp)}` };
  });
  zipDocs(`${c.name} Personalakten ${new Date().toISOString().slice(0, 10)}.zip`, items);
}
